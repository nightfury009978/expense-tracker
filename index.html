<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expense Tracker</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #080711;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: rgba(18, 16, 35, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Neon Glowing Borders & Text */
        .neon-border-cyan {
            border: 1px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
        }

        .neon-border-pink {
            border: 1px solid rgba(236, 72, 153, 0.5);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.25);
        }

        .neon-text-cyan {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        /* Active Tab Button */
        .tab-btn-active {
            background: linear-gradient(135deg, #00f0ff 0%, #a855f7 100%);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            color: #ffffff;
        }

        /* Quick Add Submit Button */
        .btn-glow-add {
            background: linear-gradient(180deg, #00f0ff 0%, #d946ef 100%);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5), 0 0 20px rgba(217, 70, 239, 0.4);
        }

        /* Category Pill Styling */
        .cat-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .cat-pill.active {
            border-color: #00f0ff;
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            color: #ffffff;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="min-h-screen pb-10 pt-4 px-4 flex justify-center items-start">

    <div class="w-full max-w-sm mx-auto space-y-4">
        
        <!-- Header -->
        <header class="flex items-center justify-between px-1">
            <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-1">
                <span>Expense tracker</span>
            </h1>
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-full overflow-hidden border border-cyan-400/50">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=100&q=80" alt="Avatar" class="w-full h-full object-cover">
                </div>
                <button onclick="clearAllData()" class="text-gray-400 hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Time Period Selector -->
        <div class="glass-card p-1 rounded-2xl flex items-center justify-between">
            <button onclick="setPeriod('daily')" id="tab-daily" class="w-1/3 py-2 text-xs font-semibold rounded-xl text-gray-400 transition">
                Daily
            </button>
            <button onclick="setPeriod('weekly')" id="tab-weekly" class="w-1/3 py-2 text-xs font-semibold rounded-xl text-gray-400 transition">
                Weekly
            </button>
            <button onclick="setPeriod('monthly')" id="tab-monthly" class="w-1/3 py-2 text-xs font-semibold rounded-xl tab-btn-active transition">
                Monthly
            </button>
        </div>

        <!-- Total Overview Card -->
        <div class="glass-card neon-border-cyan p-4 rounded-3xl space-y-3 relative overflow-hidden">
            <div class="flex items-center justify-between text-xs text-gray-400">
                <span id="period-title">Total This Month</span>
                <span class="text-emerald-400 font-medium flex items-center gap-0.5">▲ +4.5%</span>
            </div>

            <div class="text-3xl font-extrabold tracking-tight text-white" id="main-total-amount">
                ₹1,245.50
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
                <div class="bg-white/5 rounded-2xl p-2.5 border border-white/5 relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-cyan-400"></div>
                    <p class="text-[10px] text-gray-400">Today</p>
                    <p class="text-xs font-bold text-white mt-0.5" id="stat-today">₹24.50</p>
                </div>
                <div class="bg-white/5 rounded-2xl p-2.5 border border-white/5 relative overflow-hidden">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-pink-500"></div>
                    <p class="text-[10px] text-gray-400">This Week</p>
                    <p class="text-xs font-bold text-white mt-0.5" id="stat-week">₹320.00</p>
                </div>
            </div>
        </div>

        <!-- Dual Wave Dynamic Chart -->
        <div class="glass-card p-3 rounded-3xl relative">
            <div class="h-32 w-full relative">
                <canvas id="waveChart"></canvas>
            </div>
            <!-- Indicator Dots -->
            <div class="flex justify-center items-center space-x-1.5 mt-2">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 opacity-40"></span>
                <span class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#00f0ff]"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 opacity-40"></span>
            </div>
        </div>

        <!-- Quick Add Section -->
        <div class="glass-card neon-border-pink p-4 rounded-3xl space-y-3">
            <h2 class="text-xs font-bold text-gray-200">Quick Add</h2>

            <form onsubmit="handleAddExpense(event)" class="flex gap-2">
                <div class="flex-1 space-y-2">
                    <div class="flex bg-black/40 border border-white/10 rounded-xl px-3 py-1.5 items-center">
                        <input type="text" id="expTitle" placeholder="Add Expense" required 
                            class="bg-transparent text-xs w-full focus:outline-none text-white placeholder-gray-500">
                        <span class="text-cyan-400 font-bold text-xs ml-1">₹</span>
                        <input type="number" id="expAmount" placeholder="0" step="0.01" required 
                            class="bg-transparent text-xs w-16 focus:outline-none text-white text-right placeholder-gray-500">
                    </div>

                    <!-- Category Pills -->
                    <div class="flex flex-wrap gap-1" id="cat-pill-group">
                        <button type="button" onclick="selectCat('Food')" data-cat="Food" class="cat-pill active px-2.5 py-1 rounded-lg text-[10px] font-medium text-gray-300">🍿 Food</button>
                        <button type="button" onclick="selectCat('Transport')" data-cat="Transport" class="cat-pill px-2.5 py-1 rounded-lg text-[10px] font-medium text-gray-300">🚗 Transport</button>
                        <button type="button" onclick="selectCat('Shopping')" data-cat="Shopping" class="cat-pill px-2.5 py-1 rounded-lg text-[10px] font-medium text-gray-300">🛍️ Shopping</button>
                        <button type="button" onclick="selectCat('Entertainment')" data-cat="Entertainment" class="cat-pill px-2.5 py-1 rounded-lg text-[10px] font-medium text-gray-300">🎬 Entertainment</button>
                        <button type="button" onclick="selectCat('Bills')" data-cat="Bills" class="cat-pill px-2.5 py-1 rounded-lg text-[10px] font-medium text-gray-300">💡 Bills</button>
                    </div>
                </div>

                <!-- Glow Add Button -->
                <button type="submit" class="btn-glow-add w-12 rounded-2xl flex items-center justify-center text-white text-2xl font-light active:scale-95 transition">
                    +
                </button>
            </form>
        </div>

        <!-- Recent Expenses Section -->
        <div class="space-y-2">
            <h3 class="text-xs font-bold text-gray-300 px-1">Recent Expenses</h3>
            
            <div id="expenses-list" class="grid grid-cols-2 gap-2">
                <!-- Dynamic Items Inserted Here -->
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        let selectedCategory = 'Food';
        let currentPeriod = 'monthly';
        let chartInstance = null;

        // Default Data
        let transactions = JSON.parse(localStorage.getItem('auraspend_inr_txs')) || [
            { id: 1, title: 'Starbucks', amount: 4.50, category: 'Food', sub: 'Bills' },
            { id: 2, title: 'Uber', amount: 15.20, category: 'Transport', sub: 'Entertainment' },
            { id: 3, title: 'Uber', amount: 15.20, category: 'Transport', sub: 'Shopping' },
            { id: 4, title: 'Uber', amount: 4.50, category: 'Food', sub: 'Entertainment' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderChart();
            updateUI();
        });

        function selectCat(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function handleAddExpense(e) {
            e.preventDefault();
            const title = document.getElementById('expTitle').value.trim();
            const amount = parseFloat(document.getElementById('expAmount').value);

            if (!title || isNaN(amount)) return;

            const newTx = {
                id: Date.now(),
                title: title,
                amount: amount,
                category: selectedCategory,
                sub: 'Bills'
            };

            transactions.unshift(newTx);
            saveData();
            
            document.getElementById('expTitle').value = '';
            document.getElementById('expAmount').value = '';
            
            updateUI();
        }

        function deleteTx(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveData();
            updateUI();
        }

        function clearAllData() {
            if(confirm('Reset all expense records?')) {
                transactions = [];
                saveData();
                updateUI();
            }
        }

        function saveData() {
            localStorage.setItem('auraspend_inr_txs', JSON.stringify(transactions));
        }

        function setPeriod(p) {
            currentPeriod = p;
            ['daily', 'weekly', 'monthly'].forEach(tab => {
                const el = document.getElementById(`tab-${tab}`);
                if (tab === p) {
                    el.className = 'w-1/3 py-2 text-xs font-semibold rounded-xl tab-btn-active transition';
                } else {
                    el.className = 'w-1/3 py-2 text-xs font-semibold rounded-xl text-gray-400 transition';
                }
            });

            document.getElementById('period-title').innerText = 
                p === 'daily' ? 'Total Today' : p === 'weekly' ? 'Total This Week' : 'Total This Month';

            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('expenses-list');
            list.innerHTML = '';

            let total = 0;
            transactions.forEach(tx => total += tx.amount);

            document.getElementById('main-total-amount').innerText = `₹${total.toFixed(2)}`;
            document.getElementById('stat-today').innerText = `₹${(total * 0.1).toFixed(2)}`;
            document.getElementById('stat-week').innerText = `₹${(total * 0.45).toFixed(2)}`;

            transactions.forEach(tx => {
                const card = document.createElement('div');
                card.className = 'glass-card p-2.5 rounded-2xl flex items-center justify-between border border-white/5 relative group';
                
                const iconMap = {
                    'Food': '☕',
                    'Transport': '🚗',
                    'Shopping': '🛍️',
                    'Entertainment': '🎬',
                    'Bills': '💡'
                };

                card.innerHTML = `
                    <div class="flex items-center space-x-2 overflow-hidden">
                        <div class="w-7 h-7 rounded-lg bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-xs">
                            ${iconMap[tx.category] || '📁'}
                        </div>
                        <div class="truncate">
                            <p class="text-[11px] font-bold text-white truncate">${tx.title}</p>
                            <span class="text-[9px] text-gray-400 bg-white/5 px-1.5 py-0.5 rounded border border-white/5">${tx.category}</span>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-bold text-white">-₹${tx.amount.toFixed(2)}</p>
                        <button onclick="deleteTx(${tx.id})" class="text-[9px] text-red-400 opacity-60 hover:opacity-100">delete</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function renderChart() {
            const ctx = document.getElementById('waveChart').getContext('2d');
            
            const gradCyan = ctx.createLinearGradient(0, 0, 0, 120);
            gradCyan.addColorStop(0, 'rgba(0, 240, 255, 0.4)');
            gradCyan.addColorStop(1, 'rgba(0, 240, 255, 0.0)');

            const gradPink = ctx.createLinearGradient(0, 0, 0, 120);
            gradPink.addColorStop(0, 'rgba(236, 72, 153, 0.4)');
            gradPink.addColorStop(1, 'rgba(236, 72, 153, 0.0)');

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'],
                    datasets: [
                        {
                            data: [30, 45, 25, 60, 40, 70, 50],
                            borderColor: '#00f0ff',
                            borderWidth: 2,
                            fill: true,
                            backgroundColor: gradCyan,
                            tension: 0.4,
                            pointRadius: 0
                        },
                        {
                            data: [15, 25, 40, 20, 55, 30, 65],
                            borderColor: '#ec4899',
                            borderWidth: 2,
                            fill: true,
                            backgroundColor: gradPink,
                            tension: 0.4,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { display: false },
                        y: { display: false }
                    }
                }
            });
        }
    </script>
</body>
</html>
