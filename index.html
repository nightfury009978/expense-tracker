<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AuraSpend - Expense Tracker</title>
<meta name="description" content="Private, offline-ready expense tracker with budgets, insights and charts.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AuraSpend">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#F4F1EA;--card:#fff;--ink:#14213D;--mute:#6b6656;--line:#e3ddcd;--gold:#C8963E;--gold2:#E6C468;--red:#b4443a;--green:#2f7d5b;--navy:#14213D}
[data-theme=dark]{--bg:#0e1424;--card:#18203a;--ink:#f3eedf;--mute:#9aa0b4;--line:#2a3352;--navy:#1f2c52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
body{background:var(--bg);color:var(--ink);font:500 14px/1.45 Manrope,system-ui,sans-serif;padding:env(safe-area-inset-top) 14px calc(84px + env(safe-area-inset-bottom));min-height:100vh}
.wrap{max-width:430px;margin:0 auto}.hide{display:none!important}
h1,h2,.num{font-family:Fraunces,Georgia,serif}
.shine{font-weight:800;font-size:26px;letter-spacing:-.5px;background:linear-gradient(110deg,var(--ink) 35%,var(--gold2) 46%,#fff4cf 50%,var(--gold2) 54%,var(--ink) 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4.5s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
@media(prefers-reduced-motion:reduce){.shine{animation:none}}
h2{font-size:18px;font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{background:var(--navy);color:#F4F1EA;border:1px solid var(--gold);position:relative;overflow:hidden}
.hero .big{font-size:36px;font-weight:800;color:var(--gold2)}
.hero small,.mute{color:var(--mute);font-size:12px}.hero small{color:#b9bfd1}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:8px;border-radius:11px;font:600 13px Manrope}
.seg button.on{background:var(--ink);color:var(--bg)}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 12px;font:500 14px Manrope;outline:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px;font:700 14px Manrope;width:100%}
.btn.gold{background:var(--gold);color:#fff}.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.red{background:none;color:var(--red);border:1px solid var(--red)}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pill{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:6px 10px;font:600 12px Manrope}.pill.on{background:var(--gold);border-color:var(--gold);color:#fff}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .4s}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
.ic{width:36px;height:36px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}
.tx .t{flex:1;min-width:0}.tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{background:none;border:0;color:var(--mute);font-size:16px;padding:6px}
.neg{color:var(--red)}.pos{color:var(--green)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mute);font:600 11px Manrope;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--gold)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:9;font-weight:600}
#toast button{background:none;border:0;color:var(--gold2);font:700 13px Manrope}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px;font-weight:600}
.err{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
<header><h1 class="shine">AuraSpend</h1><div class="row"><button class="btn ghost hide" id="inst" style="width:auto;padding:8px 12px" onclick="install()">Install</button></div></header>

<section id="lock" class="card" style="margin-top:30px">
  <h2>Welcome</h2><p class="mute">Log in or create an account. Your data stays on this device.</p>
  <form id="af" onsubmit="auth(event,'in')">
    <label for="u">Username</label><input id="u" autocomplete="username" required>
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
    <div class="err" id="aerr"></div>
    <div class="g2" style="margin-top:6px"><button class="btn">Log in</button><button type="button" class="btn gold" onclick="auth(event,'up')">Create account</button></div>
  </form>
</section>

<main id="app" class="hide">
<!-- HOME -->
<section id="v-home">
  <div class="seg" id="pseg"><button data-p="daily" class="on">Daily</button><button data-p="weekly">Weekly</button><button data-p="monthly">Monthly</button></div>
  <div class="card hero">
    <small id="ptitle">Spent today</small>
    <div class="big num" id="total">0</div>
    <div class="g2" style="margin-top:8px"><div><small>Income</small><div class="num pos" id="inc" style="color:#7ddba8;font-weight:700">0</div></div><div><small>Balance</small><div class="num" id="bal" style="font-weight:700">0</div></div></div>
    <div style="margin-top:12px"><div class="row sp"><small id="bt">Monthly budget</small><small id="bp"></small></div><div class="bar" style="margin-top:4px"><i id="bf" style="width:0"></i></div></div>
  </div>
  <div class="card" id="chbox"><div class="row sp"><b id="ctitle">Trend</b><span class="mute">Swipe</span></div><div style="height:150px;margin-top:6px" id="sw"><canvas id="c1"></canvas></div><div class="dots" id="dots"><i></i><i></i><i></i></div></div>
  <div class="card" id="addbox">
    <div class="seg" id="tseg" style="margin-bottom:8px"><button data-t="expense" class="on">Expense</button><button data-t="income">Income</button></div>
    <form onsubmit="add(event)">
      <div class="g2"><input id="et" placeholder="Coffee with Riya" required maxlength="40"><input id="ea" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="Amount" required></div>
      <input id="ed" type="date" style="margin-top:8px">
      <div class="pills" id="cats" style="margin:10px 0"></div>
      <button class="btn gold">Add entry</button>
    </form>
  </div>
  <div class="row" style="margin-bottom:8px"><input id="q" placeholder="Search entries" oninput="renderList()"><select id="fc" style="width:46%" onchange="renderList()"></select></div>
  <div class="card" id="list"></div>
</section>

<!-- STATS -->
<section id="v-stats" class="hide">
  <h2 style="margin-bottom:8px">Insights</h2><input type="month" id="sm" onchange="renderStats()" style="margin-bottom:12px">
  <div class="g2"><div class="card"><small class="mute">Spent</small><div class="num" id="s1" style="font-size:22px;font-weight:700">0</div></div><div class="card"><small class="mute">Income</small><div class="num pos" id="s2" style="font-size:22px;font-weight:700">0</div></div></div>
  <div class="card"><div id="ins" class="mute" style="line-height:1.7"></div></div>
  <div class="card"><b>By category</b><div id="cl" style="margin-top:8px"></div></div>
  <div class="card"><b>Last 6 months</b><div style="height:160px;margin-top:6px"><canvas id="c2"></canvas></div></div>
</section>

<!-- BUDGET -->
<section id="v-budget" class="hide">
  <h2 style="margin-bottom:8px">Budget</h2>
  <div class="card"><label for="bi" style="margin-top:0">Monthly budget</label><input id="bi" type="number" inputmode="decimal" min="0" placeholder="e.g. 30000"><label for="cur">Currency symbol</label>
  <select id="cur"><option>₹</option><option>$</option><option>€</option><option>£</option><option>¥</option><option>AED</option></select>
  <button class="btn gold" style="margin-top:12px" onclick="saveBudget()">Save budget</button></div>
  <div class="card"><b>Budget by category</b><p class="mute" id="bc" style="margin-top:6px"></p></div>
</section>

<!-- SETTINGS -->
<section id="v-set" class="hide">
  <h2 style="margin-bottom:8px">Settings</h2>
  <div class="card"><p class="mute" id="who"></p>
    <div class="g2" style="margin-top:10px"><button class="btn ghost" onclick="toggleTheme()">Dark / light</button><button class="btn ghost" onclick="logout()">Log out</button></div></div>
  <div class="card"><b>Your data</b>
    <div class="g2" style="margin-top:10px"><button class="btn ghost" onclick="exportCSV()">Export CSV</button><button class="btn ghost" onclick="exportJSON()">Backup JSON</button></div>
    <button class="btn ghost" style="margin-top:8px" onclick="$('imp').click()">Restore from backup</button><input type="file" id="imp" accept=".json" class="hide" onchange="importJSON(this)">
    <button class="btn red" style="margin-top:8px" onclick="wipe()">Erase all my entries</button></div>
</section>
</main>
</div>

<nav id="nav" class="hide">
  <button data-v="home" class="on"><span>🏠</span>Home</button><button data-v="stats"><span>📊</span>Insights</button><button data-v="budget"><span>🎯</span>Budget</button><button data-v="set"><span>⚙️</span>Settings</button>
</nav>
<div id="toast" class="hide"></div>

<script>
const $=id=>document.getElementById(id);
const CATS=[['Food','🍽️'],['Transport','🚗'],['Shopping','🛍️'],['Entertainment','🎬'],['Bills','💡'],['Fitness','🏋️'],['Health','🩺'],['Education','📚'],['Travel','✈️'],['Other','📌']];
const IC=Object.fromEntries(CATS.concat([['Income','💰']]));
const COL=['#14213D','#C8963E','#2f7d5b','#7a5c99','#b4443a','#3a7ca5','#d08c60','#5c6b73','#9a8c5a','#8d99ae'];
const J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let users=J('as4_users',{}),U=localStorage.getItem('as4_active'),tx=[],S={budget:0,cur:'₹',theme:'light'};
let period='daily',cat='Food',type='expense',ci=0,c1,c2,undoT,dp;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>S.cur+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const T=t=>+new Date(t.date), exp=a=>a.filter(t=>t.type!=='income'), inc=a=>a.filter(t=>t.type==='income');
const sum=a=>a.reduce((s,t)=>s+t.amount,0);
const store=()=>{localStorage.setItem('as4_tx_'+U,JSON.stringify(tx));localStorage.setItem('as4_set_'+U,JSON.stringify(S))};
const ink=()=>getComputedStyle(document.documentElement).getPropertyValue('--mute').trim();

/* ---------- auth (salted SHA-256, local only) ---------- */
async function hash(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function mk(k,n,p){const salt=crypto.randomUUID();users[k]={n,salt,h:await hash(p,salt)};localStorage.setItem('as4_users',JSON.stringify(users))}
async function auth(e,m){
  e.preventDefault();const n=$('u').value.trim(),p=$('p').value,k=n.toLowerCase(),er=$('aerr');
  if(!n||!p){er.textContent='Enter a username and password.';return}
  if(m==='up'){
    if(users[k]){er.textContent="That username's taken. Try logging in.";return}
    if(p.length<4){er.textContent='Use at least 4 characters.';return}
    await mk(k,n,p);return start(k)}
  if(!users[k]){const o=J('auraspend_registered_users',{})[k];if(o&&o.password===p)await mk(k,o.username,p)}
  const u=users[k];if(!u||u.h!==await hash(p,u.salt)){er.textContent='Wrong username or password.';return}
  start(k)}
function start(k){U=k;localStorage.setItem('as4_active',k);load();boot()}
function load(){
  tx=J('as4_tx_'+U,[]);S=Object.assign({budget:0,cur:'₹',theme:'light'},J('as4_set_'+U,{}));
  const old=localStorage.getItem('auraspend_v3_txs');
  if(old&&!localStorage.getItem('as4_tx_'+U)){tx=J('auraspend_v3_txs',[]).map(t=>({...t,type:'expense'}));store();localStorage.removeItem('auraspend_v3_txs')}}
function logout(){U=null;localStorage.removeItem('as4_active');location.reload()}

/* ---------- boot / nav ---------- */
function boot(){
  $('lock').classList.add('hide');$('app').classList.remove('hide');$('nav').classList.remove('hide');
  document.documentElement.dataset.theme=S.theme;$('who').textContent='Signed in as '+(users[U]?.n||U);
  $('ed').value=new Date().toLocaleDateString('en-CA');$('bi').value=S.budget||'';$('cur').value=S.cur;
  $('fc').innerHTML='<option>All</option>'+CATS.map(c=>`<option>${c[0]}</option>`).join('')+'<option>Income</option>';
  drawCats();render();
  const a=new URLSearchParams(location.search).get('action');if(a==='stats')show('stats');if(a==='add'){show('home');$('et').focus()}}
function show(v){['home','stats','budget','set'].forEach(x=>$('v-'+x).classList.toggle('hide',x!==v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='stats')renderStats();if(v==='budget')renderBudget();window.scrollTo(0,0)}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('pseg').onclick=e=>{const p=e.target.dataset.p;if(!p)return;period=p;[...$('pseg').children].forEach(b=>b.classList.toggle('on',b.dataset.p===p));render()};
$('tseg').onclick=e=>{const t=e.target.dataset.t;if(!t)return;type=t;[...$('tseg').children].forEach(b=>b.classList.toggle('on',b.dataset.t===t));$('cats').classList.toggle('hide',t==='income')};
function drawCats(){$('cats').innerHTML=CATS.map(c=>`<button type="button" class="pill${c[0]===cat?' on':''}" data-c="${c[0]}">${c[1]} ${c[0]}</button>`).join('')}
$('cats').onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;drawCats()}};

/* ---------- data ops ---------- */
function add(e){
  e.preventDefault();const title=$('et').value.trim(),amount=parseFloat($('ea').value);if(!title||!(amount>0))return;
  const d=$('ed').value,today=new Date().toLocaleDateString('en-CA');
  const date=(!d||d===today)?new Date().toISOString():new Date(d+'T12:00:00').toISOString();
  tx.unshift({id:Date.now(),title,amount,type,category:type==='income'?'Income':cat,date});
  store();$('et').value='';$('ea').value='';render();toast(type==='income'?'Income added':'Expense added');
  if(type==='expense'&&S.budget){const m=monthTx(new Date()),s=sum(exp(m));if(s>S.budget)toast('Over your monthly budget')}}
function del(id){const i=tx.findIndex(t=>t.id===id);if(i<0)return;const [r]=tx.splice(i,1);store();render();toast('Entry deleted','Undo',()=>{tx.splice(i,0,r);store();render()})}
function wipe(){if(confirm('Erase all entries for this account? This can\'t be undone.')){tx=[];store();render();toast('All entries erased')}}
function toast(m,a,fn){const t=$('toast');t.classList.remove('hide');t.innerHTML=`<span>${esc(m)}</span>`+(a?`<button>${a}</button>`:'');
  if(a)t.querySelector('button').onclick=()=>{fn();t.classList.add('hide')};clearTimeout(undoT);undoT=setTimeout(()=>t.classList.add('hide'),a?5000:2200)}
function saveBudget(){S.budget=Math.max(0,parseFloat($('bi').value)||0);S.cur=$('cur').value;store();render();renderBudget();toast('Budget saved')}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;store();render()}

/* ---------- time helpers ---------- */
function start0(p){const d=new Date();d.setHours(0,0,0,0);if(p==='weekly')d.setDate(d.getDate()-((d.getDay()+6)%7));if(p==='monthly')d.setDate(1);return+d}
const monthTx=d=>tx.filter(t=>{const x=new Date(t.date);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()});
const pTx=()=>tx.filter(t=>T(t)>=start0(period));

/* ---------- render home ---------- */
function render(){
  const a=pTx(),s=sum(exp(a)),i=sum(inc(a));
  $('ptitle').textContent={daily:'Spent today',weekly:'Spent this week',monthly:'Spent this month'}[period];
  $('total').textContent=fmt(s);$('inc').textContent=fmt(i);$('bal').textContent=fmt(i-s);
  const ms=sum(exp(monthTx(new Date())));
  if(S.budget){const p=ms/S.budget*100;$('bf').style.width=Math.min(100,p)+'%';$('bf').style.background=p>=100?'#e0675b':p>=80?'#e6a04d':'var(--gold)';
    $('bt').textContent='Monthly budget';$('bp').textContent=`${fmt(ms)} of ${fmt(S.budget)}`}
  else{$('bf').style.width='0';$('bt').textContent='No budget set. Add one in Budget.';$('bp').textContent=''}
  renderList();drawChart()}
function renderList(){
  const q=$('q').value.toLowerCase(),f=$('fc').value;
  const a=tx.filter(t=>(f==='All'||t.category===f)&&t.title.toLowerCase().includes(q)).sort((x,y)=>T(y)-T(x)).slice(0,60);
  $('list').innerHTML=a.length?a.map(t=>{const d=new Date(t.date),inc=t.type==='income';
    return`<div class="tx"><div class="ic">${IC[t.category]||'📌'}</div><div class="t"><b>${esc(t.title)}</b><span class="mute">${d.toLocaleDateString('en-IN',{day:'numeric',month:'short'})} · ${esc(t.category)}</span></div><b class="num ${inc?'pos':'neg'}" style="flex:none">${inc?'+':'-'}${fmt(t.amount)}</b><button class="x" aria-label="Delete" onclick="del(${t.id})">✕</button></div>`}).join('')
   :'<p class="mute" style="text-align:center;padding:14px">No entries yet. Add your first expense above.</p>'}

/* ---------- charts ---------- */
function trend(){const l=[],d=[];
  if(period==='monthly'){for(let i=5;i>=0;i--){const m=new Date();m.setDate(1);m.setMonth(m.getMonth()-i);l.push(m.toLocaleString('en',{month:'short'}));d.push(sum(exp(monthTx(m))))}}
  else for(let i=6;i>=0;i--){const m=new Date();m.setHours(0,0,0,0);m.setDate(m.getDate()-i);const e=+m+864e5;l.push(m.toLocaleString('en',{weekday:'short'}));d.push(sum(exp(tx.filter(t=>T(t)>=m&&T(t)<e))))}
  return{l,d}}
function catTotals(a){const m={};exp(a).forEach(t=>m[t.category]=(m[t.category]||0)+t.amount);return Object.entries(m).sort((x,y)=>y[1]-x[1])}
function drawChart(){
  const tt={backgroundColor:'#14213D',titleColor:'#E6C468',bodyColor:'#fff',displayColors:false,callbacks:{label:c=>fmt(c.raw)}};
  const mk=ink(),base={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:tt}};
  const sc={x:{grid:{display:false},ticks:{color:mk,font:{size:10,family:'Manrope'}}},y:{display:false,beginAtZero:true}};
  const titles=['Spending trend','By category','Share of spending'];$('ctitle').textContent=titles[ci];
  [...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i===ci));
  if(c1)c1.destroy();const ctx=$('c1').getContext('2d');
  if(ci===0){const t=trend(),g=ctx.createLinearGradient(0,0,0,150);g.addColorStop(0,'rgba(200,150,62,.4)');g.addColorStop(1,'rgba(200,150,62,0)');
    c1=new Chart(ctx,{type:'line',data:{labels:t.l,datasets:[{data:t.d,borderColor:'#C8963E',backgroundColor:g,fill:true,tension:.4,borderWidth:3,pointRadius:3,pointBackgroundColor:'#14213D'}]},options:{...base,scales:sc}})}
  else{const c=catTotals(pTx()),empty=!c.length,lb=empty?['No data']:c.map(x=>x[0]),dt=empty?[1]:c.map(x=>x[1]);
    c1=new Chart(ctx,ci===1?{type:'bar',data:{labels:lb,datasets:[{data:dt,backgroundColor:COL,borderRadius:6}]},options:{...base,scales:sc}}
      :{type:'doughnut',data:{labels:lb,datasets:[{data:dt,backgroundColor:empty?['#e3ddcd']:COL,borderWidth:0}]},options:{...base,cutout:'68%'}})}}
(()=>{let x0=0;const a=$('sw');a.addEventListener('touchstart',e=>x0=e.changedTouches[0].screenX,{passive:true});
 a.addEventListener('touchend',e=>{const d=x0-e.changedTouches[0].screenX;if(Math.abs(d)>35){ci=(ci+(d>0?1:2))%3;drawChart()}},{passive:true})})();
$('dots').onclick=e=>{const i=[...$('dots').children].indexOf(e.target);if(i>-1){ci=i;drawChart()}};

/* ---------- insights ---------- */
function renderStats(){
  const v=$('sm').value||(new Date().toISOString().slice(0,7));$('sm').value=v;const[y,m]=v.split('-').map(Number),d=new Date(y,m-1,1);
  const a=monthTx(d),prev=monthTx(new Date(y,m-2,1)),s=sum(exp(a)),ps=sum(exp(prev)),days=new Date(y,m,0).getDate();
  $('s1').textContent=fmt(s);$('s2').textContent=fmt(sum(inc(a)));const c=catTotals(a),L=[];
  if(c.length){L.push(`Top category: <b>${IC[c[0][0]]} ${esc(c[0][0])}</b> (${fmt(c[0][1])})`);L.push(`Daily average: <b>${fmt(s/days)}</b>`);
    if(ps)L.push(`Versus last month: <b class="${s>ps?'neg':'pos'}">${s>ps?'▲':'▼'} ${Math.abs((s-ps)/ps*100).toFixed(0)}%</b>`);
    if(S.budget)L.push(s>S.budget?`<b class="neg">Over budget by ${fmt(s-S.budget)}</b>`:`Left in budget: <b class="pos">${fmt(S.budget-s)}</b>`)}
  $('ins').innerHTML=L.join('<br>')||'No spending this month.';
  $('cl').innerHTML=c.map(([n,v2])=>`<div style="margin-bottom:10px"><div class="row sp"><span>${IC[n]} ${esc(n)}</span><b>${fmt(v2)}</b></div><div class="bar" style="margin-top:4px"><i style="width:${v2/c[0][1]*100}%"></i></div></div>`).join('')||'<p class="mute">Nothing to show.</p>';
  const l=[],dt=[];for(let i=5;i>=0;i--){const x=new Date(y,m-1-i,1);l.push(x.toLocaleString('en',{month:'short'}));dt.push(sum(exp(monthTx(x))))}
  if(c2)c2.destroy();c2=new Chart($('c2'),{type:'bar',data:{labels:l,datasets:[{data:dt,backgroundColor:l.map((_,i)=>i===5?'#C8963E':'#14213D'),borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{displayColors:false,callbacks:{label:c=>fmt(c.raw)}}},scales:{x:{grid:{display:false},ticks:{color:ink()}},y:{display:false,beginAtZero:true}}}})}
function renderBudget(){const c=catTotals(monthTx(new Date())),tot=sum(exp(monthTx(new Date())));
  $('bc').innerHTML=c.length?c.map(([n,v])=>`${IC[n]} ${esc(n)}: <b>${(v/tot*100).toFixed(0)}%</b>`).join(' &nbsp; '):'Spending split for this month will appear here.'}

/* ---------- export / import ---------- */
function dl(name,txt,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';dl('auraspend.csv','Date,Type,Category,Title,Amount\n'+tx.map(t=>[t.date,t.type||'expense',t.category,q(t.title),t.amount].join(',')).join('\n'),'text/csv')}
function exportJSON(){dl('auraspend-backup.json',JSON.stringify({tx,S}),'application/json')}
function importJSON(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;
  const ids=new Set(tx.map(t=>t.id));d.tx.filter(t=>t&&t.title&&t.amount>0&&!ids.has(t.id)).forEach(t=>tx.push({id:t.id||Date.now()+Math.random(),title:String(t.title).slice(0,40),amount:+t.amount,type:t.type==='income'?'income':'expense',category:t.category||'Other',date:t.date||new Date().toISOString()}));
  store();render();toast('Backup restored')}catch{toast('That file isn\'t a valid backup')}el.value=''};r.readAsText(f)}

/* ---------- PWA ---------- */
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').classList.remove('hide')});
function install(){if(dp){dp.prompt();dp=null;$('inst').classList.add('hide')}}
addEventListener('appinstalled',()=>$('inst').classList.add('hide'));
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>{
  r.addEventListener('updatefound',()=>{const n=r.installing;n&&n.addEventListener('statechange',()=>{if(n.state==='installed'&&navigator.serviceWorker.controller)toast('Update ready','Refresh',()=>{n.postMessage('SKIP_WAITING');location.reload()})})})}).catch(()=>{}));

if(U&&users[U]){load();boot()}
</script>
